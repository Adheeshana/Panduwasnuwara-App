# Local Supabase config for the Panduwasnuwara app.
# Limits and feature switches live in public.app_settings, not here.

project_id = "panduwasnuwara"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.test_otp]
# Development test numbers are added in the dashboard / config as needed (SRS §2).

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
